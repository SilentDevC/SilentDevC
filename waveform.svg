<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="Animated digital waveform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge"><rect width="1000" height="110" fill="url(#fade)"/></mask>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .t   { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .clk { stroke: #0891b2; }
    .dat { stroke: #1f6feb; }
    .bus { stroke: #7c3aed; fill: #7c3aed; fill-opacity: 0.10; stroke-width: 1.6; stroke-linejoin: round; }
    text { font: 600 11px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #7c3aed; }
  </style>
  <g mask="url(#edge)">
    <g>
      <path class="t clk" d="M0 34 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30 V14 h30 V34 h30"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-60 0" dur="0.8571s" repeatCount="indefinite"/>
    </g>
    <g>
      <path class="t dat" d="M0 70 h60 V50 h60 h60 V70 h60 V50 h60 V70 h60 h60 V50 h60 h60 h60 V70 h60 V50 h60 V70 h60 V50 h60 h60 V70 h60 V50 h60 V70 h60 h60 V50 h60 h60 h60 V70 h60 V50 h60 V70 h60 V50 h60 h60 V70 h60 V50 h60 V70 h60"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-720 0" dur="10.2857s" repeatCount="indefinite"/>
    </g>
    <g>
      <path class="bus" d="M6 92 L14 82 H166 L174 92 L166 102 H14 Z"/><path class="bus" d="M186 92 L194 82 H346 L354 92 L346 102 H194 Z"/><path class="bus" d="M366 92 L374 82 H526 L534 92 L526 102 H374 Z"/><path class="bus" d="M546 92 L554 82 H706 L714 92 L706 102 H554 Z"/><path class="bus" d="M726 92 L734 82 H886 L894 92 L886 102 H734 Z"/><path class="bus" d="M906 92 L914 82 H1066 L1074 92 L1066 102 H914 Z"/><path class="bus" d="M1086 92 L1094 82 H1246 L1254 92 L1246 102 H1094 Z"/><path class="bus" d="M1266 92 L1274 82 H1426 L1434 92 L1426 102 H1274 Z"/><path class="bus" d="M1446 92 L1454 82 H1606 L1614 92 L1606 102 H1454 Z"/><path class="bus" d="M1626 92 L1634 82 H1786 L1794 92 L1786 102 H1634 Z"/><path class="bus" d="M1806 92 L1814 82 H1966 L1974 92 L1966 102 H1814 Z"/>
      <text x="90" y="96" text-anchor="middle">0x00</text><text x="270" y="96" text-anchor="middle">0x2D</text><text x="450" y="96" text-anchor="middle">0x0F</text><text x="630" y="96" text-anchor="middle">0xA5</text><text x="810" y="96" text-anchor="middle">0x00</text><text x="990" y="96" text-anchor="middle">0x2D</text><text x="1170" y="96" text-anchor="middle">0x0F</text><text x="1350" y="96" text-anchor="middle">0xA5</text><text x="1530" y="96" text-anchor="middle">0x00</text><text x="1710" y="96" text-anchor="middle">0x2D</text><text x="1890" y="96" text-anchor="middle">0x0F</text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-720 0" dur="10.2857s" repeatCount="indefinite"/>
    </g>
    <!-- sweeping scan line -->
    <rect y="0" width="90" height="110" fill="url(#scan)" opacity="0.5">
      <animate attributeName="x" from="-90" to="1000" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
