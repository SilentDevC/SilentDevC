<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" role="img" aria-label="Section divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0891b2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="9" width="1000" height="2" fill="url(#line)"/>
  <rect y="8" width="140" height="4" rx="2" fill="url(#pulse)">
    <animate attributeName="x" from="-140" to="1000" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="500" cy="10" r="3" fill="#0891b2">
    <animate attributeName="r" values="2.5;5;2.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
